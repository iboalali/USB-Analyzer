[package]
name = "usb-probe"
description = "Read-only USB / USB-C / Power Delivery state from Linux sysfs, plus a cable & charging diagnostic rule engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
# Only for the stored device labels in `overrides.rs`. This does not grow what
# ships: `usbdiag` already depends on serde_json, so the binary's tree is the
# same 13 crates it was. The library's own tree goes 10 -> 14.
serde_json = { workspace = true }
