<?xml version="1.0" encoding="UTF-8"?>
<!-- A USB-C receptacle seen end-on, with the bottleneck chain inside it: four
     bars, the third one short and red. That is the app in one picture — the
     shape says USB-C, the bars say "where does it stop". -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#body)"/>

  <!-- The receptacle: a flat oval, the Type-C silhouette. -->
  <rect x="22" y="40" width="84" height="48" rx="24"
        fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="6"/>

  <!-- Four stages. The third is the limit. -->
  <g stroke-linecap="round" stroke-width="7">
    <line x1="38" y1="57" x2="90" y2="57" stroke="#ffffff" stroke-opacity="0.92"/>
    <line x1="38" y1="71" x2="90" y2="71" stroke="#ffffff" stroke-opacity="0.92"/>
  </g>
  <line x1="38" y1="64" x2="55" y2="64" stroke="#ff7b63" stroke-width="7" stroke-linecap="round"/>
  <line x1="60" y1="64" x2="90" y2="64" stroke="#ffffff" stroke-opacity="0.35"
        stroke-width="7" stroke-linecap="round"/>
</svg>
