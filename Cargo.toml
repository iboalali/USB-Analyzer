[workspace]
resolver = "2"
members = ["crates/usb-probe", "crates/usbdiag"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
usb-probe = { path = "crates/usb-probe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = true
